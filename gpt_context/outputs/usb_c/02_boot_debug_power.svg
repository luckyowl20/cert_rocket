<text x="80" y="835" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172B43">DFU: hold BOOT, pulse RESET, release BOOT.</text>
<text x="80" y="868" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172B43">Normal boot: release BOOT and pulse RESET.</text>

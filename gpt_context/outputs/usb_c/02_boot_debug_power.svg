<text x="1320" y="625" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#172B43">Ground and ground-detect</text>
<text x="950" y="677" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172B43">1, 2, 9</text>
<text x="1140" y="677" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172B43">NC</text>
<text x="1320" y="677" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#172B43">Reserved; leave disconnected</text>
<text x="950" y="729" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172B43">10, 13, 14</text>
<text x="1140" y="729" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172B43">NC</text>
<text x="1320" y="729" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#172B43">Unused JTAG/UART in this drawing</text>
<text x="925" y="842" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172B43">SWD can upload and debug firmware without USB.</text>
<text x="925" y="875" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172B43">Power the target from its power circuit, not VTREF.</text>
<text x="925" y="908" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172B43">Check header orientation against the connector drawing.</text>
<polyline points="70,982 1730,982" fill="none" stroke="#CEDAE3" stroke-width="2"/>
<text x="80" y="1020" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#172B43">POWER: CONDITIONAL ARCHITECTURE — NOT A COMPLETE REGULATOR SCHEMATIC</text>
<text x="80" y="1070" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#526579">Only if using a protected, rechargeable 1-cell Li-ion/LiPo battery (4.2 V charge). Other batteries require a different circuit.</text>

<text x="1140" y="573" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172B43">NRST</text>
<text x="1320" y="573" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#172B43">Reset / connect-under-reset</text>
<text x="950" y="625" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172B43">5, 7, 11</text>

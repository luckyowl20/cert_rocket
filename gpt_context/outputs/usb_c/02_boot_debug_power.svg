<text x="1625" y="1174" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#AB4D14">logic</text>
<polyline points="900,1240 900,1285" fill="none" stroke="#AB4D14" stroke-width="3"/>
<rect x="710" y="1285" width="390" height="85" fill="#FFF4E9" stroke="#172B43" stroke-width="2"/>
<text x="735" y="1305" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#172B43">BAT ↔ protected 1S battery</text>
<text x="80" y="1285" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#172B43">USB budget is shared by the running board</text>
<text x="80" y="1317" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#172B43">and battery charging. No assumption of 3 A!</text>
<text x="80" y="1349" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#172B43">Use 100 mA default / USB current policy.</text>
<text x="80" y="1381" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#172B43">Power-good or safe VBUS sensing → GPIO.</text>
<text x="1195" y="1285" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#172B43">If battery is not 1S rechargeable:</text>
<text x="1195" y="1317" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#172B43">do not use this charger circuit.</text>
<text x="1195" y="1349" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#172B43">Use a suitable source selector</text>
<text x="1195" y="1381" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#172B43">and regulated 3V3 supply.</text>
<text x="80" y="1430" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526579">Power sheet still needs: protection selection, current settings, suspend control, capacitors, inductor, thermal design and sensing.</text>
<text x="80" y="1475" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#AB4D14">Prevent battery backfeed into USB. Keep deployment/pyrotechnic power physically inhibited during USB programming.</text>
<text x="80" y="1525" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#172B43">All board grounds share the intended return network. Never connect USB 5 V directly to MCU supply pins.</text>

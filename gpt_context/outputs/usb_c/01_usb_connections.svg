<text x="70" y="45" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#172B43">USB-C → STM32G4: data and connector wiring</text>
<text x="70" y="106" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#526579">USB 2.0 full-speed DEVICE / 5 V SINK. G474 electrical reference; no USB-PD or USB-to-UART bridge required.</text>

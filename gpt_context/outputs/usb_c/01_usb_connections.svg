<text x="90" y="1100" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172B43">Join the two D+ contacts at the receptacle.</text>
<text x="90" y="1133" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172B43">Join the two D− contacts at the receptacle.</text>
<text x="90" y="1166" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172B43">Keep CC1 and CC2 separate: one resistor each.</text>
<text x="90" y="1199" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172B43">All repeated VBUS/GND contacts are connected.</text>
<text x="90" y="1232" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172B43">Same net label anywhere = same electrical net.</text>

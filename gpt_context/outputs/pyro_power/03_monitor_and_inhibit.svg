<text x="955" y="1470" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#172B43">Use a 500 ms diagnostic wait (not firing latency).</text>
<text x="955" y="1501" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#172B43">Assumes total TPS_OUT capacitance ≤ 22 µF.</text>
<text x="955" y="1532" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#172B43">Below 0.5 V: near-zero under stated conditions.</text>
<text x="955" y="1563" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#172B43">Below 2.0 V: clearly invalid for this supply.</text>
<text x="955" y="1594" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#172B43">Leakage and temperature limits: see README.</text>
<text x="80" y="1730" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#AB4D14">Monitor BEFORE SW1: an energized TPS_OUT does not mean the armed rail is connected or any channel is enabled.</text>

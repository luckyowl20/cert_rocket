<text x="105" y="1502" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172B43">3S: 10.5 V    4S: 14.0 V</text>
<text x="105" y="1534" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#172B43">Configure cell count explicitly; do not infer it</text>
